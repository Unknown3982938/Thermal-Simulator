<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d1c"><title>Achievements | Thermo Lab 3D</title><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="extras.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#30264f 0,transparent 35%),#080d1c;color:#eaf1ff;font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto;padding:56px 0 80px}.eyebrow{color:#b7a0ff;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(32px,6vw,52px);margin:8px 0}.sub{color:#a9bad3;max-width:680px}.progress{margin:25px 0;padding:20px;border:1px solid #b7a0ff33;border-radius:18px;background:#17182fbb}.progress-line{height:9px;border-radius:99px;background:#29304b;overflow:hidden;margin-top:12px}.progress-line span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7b8cff,#62d4ff);border-radius:99px;transition:width .35s}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.badge-card{display:flex;gap:14px;align-items:center;padding:17px;border:1px solid #9bb7e326;border-radius:16px;background:#111e36aa}.badge-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:#1d2a48;font-size:27px;filter:grayscale(1);opacity:.45}.badge-card.unlocked{border-color:#8f83ff66;background:linear-gradient(120deg,#1b2545,#17243b)}.badge-card.unlocked .badge-icon{filter:none;opacity:1;background:#263b5b}.badge-card h3{font-size:15px;margin:0}.badge-card p{font-size:12px;color:#9fb1cc;margin:3px 0 0}.status{font-size:10px;color:#a9bad3;text-transform:uppercase;letter-spacing:1px;font-weight:800}.unlocked .status{color:#83e2bd}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{padding:10px 14px;border-radius:11px;border:1px solid #9bb7e344;background:#172a48;color:#eaf1ff;text-decoration:none;font-weight:750}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding-top:36px}}</style></head><body><main class="wrap"><div class="eyebrow">Little milestones</div><h1>Lab Achievements 🏆</h1><p class="sub">A tiny collection of milestones as you explore the laboratory. Achievements are stored locally in this browser and are not shared or synced.</p><section class="progress"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>Your progress</strong><strong id="progress-text">0 / 7 unlocked</strong></div><div class="progress-line"><span id="progress-fill"></span></div></section><div class="grid" id="achievement-grid"></div><div class="actions"><a class="btn" href="dashboard.html">← Back to dashboard</a><a class="btn" href="journal.html">Open experiment journal</a></div></main><script src="navigation.js"></script><script src="extras.js"></script><script>
(()=>{const api=window.ThermoLabExtras,grid=document.getElementById('achievement-grid');if(!api)return;const unlocked=api.getProgress().unlocked;grid.innerHTML=api.achievements.map(a=>{const yes=unlocked.includes(a.id);return `<article class="badge-card ${yes?'unlocked':''}"><div class="badge-icon">${a.icon}</div><div><div class="status">${yes?'Unlocked':'Locked'}</div><h3>${a.name}</h3><p>${a.desc}</p></div></article>`}).join('');document.getElementById('progress-text').textContent=unlocked.length+' / '+api.achievements.length+' unlocked';document.getElementById('progress-fill').style.width=(unlocked.length/api.achievements.length*100)+'%'})();
</script></body></html>
