<title>Page Not Found | Thermo Lab 3D</title>
<link rel="stylesheet" href="navigation.css">
<style>
:root{color-scheme:dark;--bg:#080d18;--text:#e8eef8;--muted:#91a2ba;--cyan:#53c8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#183252 0%,transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,650px);padding:clamp(28px,6vw,56px);text-align:center;border:1px solid rgba(148,170,205,.2);border-radius:26px;background:rgba(17,27,45,.82);box-shadow:0 24px 80px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
.code{font-size:clamp(76px,18vw,130px);font-weight:850;line-height:1;letter-spacing:-.08em;color:var(--cyan);text-shadow:0 0 35px rgba(83,200,255,.2)}
h1{margin:18px 0 10px;font-size:clamp(24px,5vw,34px)}
p{max-width:440px;margin:0 auto;color:var(--muted);line-height:1.7}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:28px}
a.action{padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700;color:#07111d;background:linear-gradient(120deg,#53c8ff,#8b8cff)}
a.secondary{color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(148,170,205,.2)}
</style>
<link rel="stylesheet" href="extras.css">
